name: HookForge CI

on:
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hookforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frida:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node 22.19.0
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Install locked Frida dependencies
        run: npm ci

      - name: Run Frida host-side checks
        run: npm run test:ci

      - name: Build production Frida bundle
        run: npm run build:prod

      - name: Record production artifact hashes
        run: npm run artifact:write

      - name: Upload production Frida artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frida-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/bundle.js
            dist/android-api.js
            dist/node-cli/*.js
            .runtime/frida-api33/production-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  frida-api33:
    needs: frida
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FRIDA_API33_RESULTS: ${{ github.workspace }}/.runtime/frida-api33/results/${{ github.run_id }}-${{ github.run_attempt }}
      FRIDA_API33_APK: ${{ github.workspace }}/.runtime/frida-api33/apk/detect-env-debug.apk
      ROOTBEER_APK: ${{ github.workspace }}/.runtime/frida-fixtures/rootbeer.apk
      ANDROID_SERIAL: emulator-5554
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7.0.1

      - name: Initialize evidence
        if: always()
        id: initialize
        run: |
          mkdir -p "$FRIDA_API33_RESULTS"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['FRIDA_API33_RESULTS'], 'job.json').write_text(json.dumps({
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'commit': os.environ['GITHUB_SHA'],
              'stage': 'initialization',
          }, indent=2) + '\n')
          PY

      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Set up Node 22.19.0
        id: node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked Frida dependencies
        id: dependencies
        run: npm ci

      - name: Download production Frida artifact
        id: production
        uses: actions/download-artifact@v8.0.1
        with:
          name: frida-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Verify production artifact
        id: verify-production
        run: npm run artifact:verify

      - name: Read fixed RootBeer sample coordinates
        id: fixture
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { sample } from './cases/rootbeer/catalog.mjs';
          const values = { ...sample.fixture, sha256: sample.sha256 };
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            Object.entries(values).map(([key, value]) => `${key}=${value}`).join('\n') + '\n');
          JS

      - name: Download and verify fixed RootBeer sample
        id: rootbeer-fixture
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_REPOSITORY: ${{ steps.fixture.outputs.repository }}
          FIXTURE_TAG: ${{ steps.fixture.outputs.tag }}
          FIXTURE_ASSET: ${{ steps.fixture.outputs.asset }}
          FIXTURE_SHA256: ${{ steps.fixture.outputs.sha256 }}
        run: |
          mkdir -p "$(dirname "$ROOTBEER_APK")"
          gh release download "$FIXTURE_TAG" --repo "$FIXTURE_REPOSITORY" \
            --pattern "$FIXTURE_ASSET" --output "$ROOTBEER_APK"
          printf '%s  %s\n' "$FIXTURE_SHA256" "$ROOTBEER_APK" | sha256sum --check

      - name: Read Frida toolchain lock
        id: version
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'test/api33')
          from prepare import load_spec
          spec = load_spec(abi='x86_64')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f"version={spec['fridaVersion']}\nsha256={spec['serverSha256']}\n")
          PY

      - name: Cache verified Android Frida server
        id: server-cache
        uses: actions/cache@v4.2.4
        with:
          path: .runtime/toolchain/python/frida-server-*
          key: frida-server-v2-${{ steps.version.outputs.version }}-android-x86_64-${{ steps.version.outputs.sha256 }}

      - name: Prepare locked client and server
        id: toolchain
        run: python test/api33/prepare.py --abi x86_64

      - name: Reclaim space for build and emulator
        id: disk
        run: |
          df -h / > "$FRIDA_API33_RESULTS/disk-before.txt"
          for unused_path in /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/dotnet /opt/ghc; do
            if [ -e "$unused_path" ]; then
              sudo rm -r -- "$unused_path"
            fi
          done
          sudo apt-get clean
          df -h / > "$FRIDA_API33_RESULTS/disk-after.txt"

      - name: Download and verify fixed detect-env fixture
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$(dirname "$FRIDA_API33_APK")"
          node --input-type=module <<'JS' > "$RUNNER_TEMP/detect-env-fixture.env"
          import { fixture } from './scripts/fixture.mjs';
          for (const key of ['repository', 'tag', 'asset']) console.log(`${key}=${fixture[key]}`);
          JS
          source "$RUNNER_TEMP/detect-env-fixture.env"
          gh release download "$tag" --repo "$repository" --pattern "$asset" --output "$FRIDA_API33_APK"
          node scripts/fixture.mjs "$FRIDA_API33_APK"
          cp test/api33/fixture.json "$FRIDA_API33_RESULTS/detect-env-fixture.json"

      - name: Enable KVM access
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Validate runtime and real APK behavior on API 33
        id: integration
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          arch: x86_64
          target: default
          disk-size: 2048M
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader -no-snapshot -noaudio
            -no-boot-anim -camera-back none -feature -Vulkan
          script: |
            python test/api33/suite.py --abi x86_64 --apk "$FRIDA_API33_APK" --output "$FRIDA_API33_RESULTS"
            npm run case:rootbeer -- --abi x86_64 --apk "$ROOTBEER_APK" --serial "$ANDROID_SERIAL" --reuse-detect-env --agent "$GITHUB_WORKSPACE/dist/android-api.js" --production-manifest "$GITHUB_WORKSPACE/.runtime/frida-api33/production-manifest.json" --output "$FRIDA_API33_RESULTS/rootbeer"

      - name: Summarize tests and initialization failures
        if: always()
        env:
          FRIDA_JOB_STATUS: ${{ job.status }}
          FRIDA_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          if [ -f test/api33/report.py ]; then
            python test/api33/report.py --abi x86_64 --output "$FRIDA_API33_RESULTS" \
              --case-result "$FRIDA_API33_RESULTS/rootbeer/result.json"
          else
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['FRIDA_API33_RESULTS'])
          root.mkdir(parents=True, exist_ok=True)
          steps = json.loads(os.environ['FRIDA_STEP_RESULTS'])
          result = {'status': 'failed', 'stage': 'checkout', 'steps': steps}
          (root / 'job-result.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Frida API 33: checkout failed before test tooling was available.\n')
          PY
          fi

      - name: Upload Frida API 33 evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frida-api33-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runtime/frida-api33/**
            !.runtime/frida-api33/**/installed-detect-env.apk
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
